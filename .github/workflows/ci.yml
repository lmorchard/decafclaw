name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required checks must also run on the merge queue's merge group, or the
  # queue waits for checks that never start.
  merge_group:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      # `make check` shells out to npm/npx for install-js and the static/
      # typecheck, so Node has to be here even though this job is "the Python
      # one". Version comes from .nvmrc so CI and local shells cannot drift.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: uv sync

      # Runs the same gate a human runs: install-js, check-message-types,
      # ruff, pyright, and tsc --noEmit over static/. Previously this job
      # open-coded only ruff and pyright, which left the generated-file drift
      # check and the JS typecheck running nowhere at all.
      - name: Check
        run: make check

      # Browser tests are marked `browser` and run in their own job below.
      # `-m` on the command line replaces the addopts expression, so the
      # default integration exclusion has to be repeated here.
      - name: Test
        # Parallelism is configured in pyproject.toml (addopts = "-n auto
        # --dist=worksteal"). `-v` is omitted because worker output
        # interleaves and the dots-style progress is more readable.
        run: uv run pytest -m "not integration and not browser" tests/ contrib/skills/

  # Browser tests run separately so the Python gate never waits on a browser
  # install, and so a Chromium-only failure is visible as its own check.
  # The runner image already ships every Chromium runtime library; the only
  # packages `--with-deps` added were fonts, and fetching them from CI's apt
  # mirror took ~6 minutes. Install the browser alone and cache it so a
  # Playwright version bump does not re-download Chromium.
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(uv run playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: uv run playwright install chromium

      - name: Test
        run: uv run pytest -m "browser and not integration" tests/ contrib/skills/

  js-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Test
        run: make test-js

  # tui/ is gated separately from `make check` (#725): it has its own
  # package-lock and node_modules, and nothing in the Python gate needs it.
  # Both goals run in one `make` invocation so install-tui's npm ci happens
  # once rather than per target.
  check-tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Type check + test
        run: make check-tui test-tui
