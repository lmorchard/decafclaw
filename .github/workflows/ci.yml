name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      # `make check` shells out to npm/npx for install-js and the static/
      # typecheck, so Node has to be here even though this job is "the Python
      # one". Version comes from .nvmrc so CI and local shells cannot drift.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: uv sync

      # Runs the same gate a human runs: install-js, check-message-types,
      # ruff, pyright, and tsc --noEmit over static/. Previously this job
      # open-coded only ruff and pyright, which left the generated-file drift
      # check and the JS typecheck running nowhere at all.
      - name: Check
        run: make check

      - name: Install test browser
        run: uv run playwright install --with-deps chromium

      - name: Test
        # Fast path on PRs: skip slow disposable-tree codegen tests if no API or web files changed.
        # On main branch pushes (or when relevant files are modified), the full suite runs.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            if ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(src/decafclaw/http_server\.py|src/decafclaw/web/|scripts/gen_api_client\.py|scripts/sticky_api_request\.ts|tests/test_api_codegen\.py)'; then
              echo "No API server, client, or codegen files modified in PR. Running fast test suite..."
              uv run pytest tests/ contrib/skills/ --ignore=tests/test_api_codegen.py
              exit 0
            fi
          fi
          uv run pytest tests/ contrib/skills/

  js-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Test
        run: make test-js

  # tui/ is gated separately from `make check` (#725): it has its own
  # package-lock and node_modules, and nothing in the Python gate needs it.
  # Both goals run in one `make` invocation so install-tui's npm ci happens
  # once rather than per target.
  check-tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Type check + test
        run: make check-tui test-tui
