# Meta-tool overlaps + the no-tool negative-control case (#303).

# -- delegate_task vs activate_skill -----------------------------------------

- name: delegate-vs-activate-research
  scenario: "Spin up a separate sub-agent to dig through the linkding ingest skill source and summarize how the ingest pipeline routes pages — I need the summary back here when it's done."
  expected: delegate_task
  near_miss: [activate_skill, subagent_spawn]
  notes: |
    "Spin up a separate sub-agent" is delegate_task — fork a child
    agent for an isolated task and get its result back. activate_skill
    loads a skill's tools into the current conversation; it doesn't run
    anything by itself. subagent_spawn's default is fire-and-forget,
    which would strand the summary in the child conversation.

- name: activate-vs-delegate-tool-access
  scenario: "I want to use the project skill in this conversation."
  expected: activate_skill
  near_miss: [delegate_task]
  notes: |
    "Use the X skill" → activate_skill loads its tools into this
    conversation. delegate_task is the wrong primitive — it's for
    doing work elsewhere, not for unlocking tools here.

# -- subagent_spawn vs delegate_task (#1113) ---------------------------------

- name: subagent-spawn-background-lifecycle
  scenario: "Kick off a subagent in the background to reorganize the vault tag taxonomy, and give me its id so I can check on it and stop it if it goes sideways."
  expected: subagent_spawn
  near_miss: [delegate_task]
  notes: |
    Background run + "give me its id so I can check on it and stop it"
    is the subagent lifecycle surface (#1113): subagent_spawn returns a
    child_conv_id immediately (fire-and-forget by default) and pairs
    with subagent_list / subagent_cancel. delegate_task blocks the
    parent until the child finishes and returns no id to manage.

- name: delegate-task-await-result
  scenario: "Hand this off to a child agent and wait for it: summarize docs/deployment.md in three sentences and bring the summary back here."
  expected: delegate_task
  near_miss: [subagent_spawn]
  notes: |
    "Hand off ... and wait ... bring the summary back here" wants the
    awaited result directly — delegate_task. subagent_spawn's default
    is fire-and-forget, which would strand the answer in the child
    conversation; picking it here (or without async_run=false) breaks
    the caller's expectation.

# -- Negative-control: no tool needed at all ---------------------------------

- name: no-tool-greeting
  scenario: "Hi! How are you doing today?"
  expected: <no_tool>
  near_miss: [vault_search, conversation_search, current_time]
  notes: |
    Pure conversational opener. The eval should reward the model for
    answering directly instead of reaching for a tool. Without this
    control case, a tool-happy bias would silently inflate pass rates
    on the disambiguation cases — failure here means the model is
    hammering tools regardless of whether a tool is appropriate.

# -- checklist_create: multi-step task tracking (#1003) ----------------------

- name: checklist-create-multistep-task
  scenario: |
    We need to perform a three-step maintenance task on the repo:
    1. Check git status and list modified files.
    2. Run ruff format and ruff check on the codebase.
    3. Run pytest on the test suite.
    Let's track this methodical work with a checklist and execute it.
  expected: checklist_create
  near_miss: [shell, workspace_read]
  notes: |
    A multi-step task with 3 distinct numbered action steps should begin by
    assembling a checklist via checklist_create, as instructed by AGENT.md
    and checklist_create's description.
