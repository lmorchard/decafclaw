# Evals for dream memory consolidation skill (#995)

- name: "dream does not rewrite recently touched page absent new journal entries"
  setup:
    skills: [dream]
    config_overrides:
      reflection.enabled: false
    workspace_files:
      vault/agent/pages/Pineapples.md: |
        ---
        summary: Pineapples are tropical fruits.
        keywords: [fruit, tropical, pineapple]
        tags: [botany]
        importance: 0.5
        ---
        # Pineapples

        > tl;dr: Comprehensive guide to pineapples.

        Pineapples grow on the ground as bromeliads.

        ## Sources
        - [[agent/journal/{today}]]
      conversations/schedule-dream-{today_sched_ts}/archive.jsonl: |
        {"role": "user", "content": "Nightly dream pass", "timestamp": "{today}T03:00:00Z"}
        {"role": "assistant", "content": "", "tool_calls": [{"id": "tc1", "function": {"name": "vault_write", "arguments": "{\"page\": \"agent/pages/Pineapples\", \"content\": \"...\"}"}}], "timestamp": "{today}T03:01:00Z"}
        {"role": "tool", "tool_call_id": "tc1", "name": "vault_write", "content": "Wrote page agent/pages/Pineapples.md", "timestamp": "{today}T03:01:05Z"}
        {"role": "assistant", "content": "HEARTBEAT_OK\nConsolidated findings into agent/pages/Pineapples. Nothing more to update.", "timestamp": "{today}T03:02:00Z"}
  input: "/dream"
  expect:
    max_tool_calls: 30
    max_tool_errors: 0
    expect_tool: dream_recent_runs
    expect_no_tool: vault_write
