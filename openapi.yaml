openapi: 3.1.0
info:
  title: FastAPI
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      description: "Liveness probe \u2014 returns the static health snapshot."
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /metrics:
    get:
      summary: Metrics Endpoint
      description: Prometheus text format metrics endpoint.
      operationId: metrics_endpoint_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /actions/confirm:
    post:
      summary: Handle Confirm
      description: Handle Mattermost interactive button callbacks for tool confirmation.
      operationId: handle_confirm_actions_confirm_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /actions/cancel:
    post:
      summary: Handle Cancel
      description: Handle Mattermost interactive button callback for stop/cancel.
      operationId: handle_cancel_actions_cancel_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/auth/login:
    post:
      summary: Auth Login
      description: Validate a one-time login token, then set the session cookie.
      operationId: auth_login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                token:
                  type: string
                  title: Token
              type: object
              required:
              - token
              title: LoginRequest
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /api/auth/logout:
    post:
      summary: Auth Logout
      description: Clear the session cookie.
      operationId: auth_logout_api_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
  /api/auth/me:
    get:
      summary: Auth Me
      description: Return the current authenticated user.
      operationId: auth_me_api_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /api/conversations:
    get:
      summary: List Conversations
      description: "List conversations and subfolders for a specific folder.\n\nQuery\
        \ params:\n    folder \u2014 folder path (default: top-level)\n\nReturns ``{folder,\
        \ folders, conversations}`` mirroring vault_list pattern."
      operationId: list_conversations_api_conversations_get
      parameters:
      - name: folder
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Folder
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      summary: Create Conversation
      description: Create a new conversation, optionally in a folder with a model.
      operationId: create_conversation_api_conversations_post
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationCreateResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                title:
                  default: ''
                  title: Title
                  type: string
                model:
                  default: ''
                  title: Model
                  type: string
                folder:
                  default: ''
                  title: Folder
                  type: string
                effort:
                  default: ''
                  title: Effort
                  type: string
              title: ConversationCreateRequest
              type: object
  /api/conversations/archived:
    get:
      summary: List Archived Conversations
      description: List archived conversations, optionally filtered by folder.
      operationId: list_archived_conversations_api_conversations_archived_get
      parameters:
      - name: folder
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Folder
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/conversations/system:
    get:
      summary: List System Conversations
      description: List system conversations, grouped by type sub-folders.
      operationId: list_system_conversations_api_conversations_system_get
      parameters:
      - name: folder
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Folder
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConversationListingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/conversations/{id}:
    get:
      summary: Wrapper
      operationId: wrapper_api_conversations__id__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    patch:
      summary: Rename Conversation
      description: Rename and/or move a conversation to a different folder.
      operationId: rename_conversation_api_conversations__id__patch
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPatchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                title:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Title
                folder:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Folder
              title: ConversationPatchRequest
              type: object
    delete:
      summary: Delete Conversation
      description: Permanently delete a conversation and all associated files.
      operationId: delete_conversation_api_conversations__id__delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationLifecycleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/conversations/{id}/history:
    get:
      summary: Wrapper
      operationId: wrapper_api_conversations__id__history_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/conversations/{id}/context:
    get:
      summary: Get Context Diagnostics
      description: Return context composer diagnostics for a conversation.
      operationId: get_context_diagnostics_api_conversations__id__context_get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextDiagnosticsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/conversations/{id}/export:
    get:
      summary: Export Conversation
      description: 'Export a conversation as raw JSONL or rendered markdown.


        Query param ``format`` must be ``jsonl`` or ``markdown``. 400 on missing

        or unknown format, 404 if the conversation isn''t owned by the user or

        no archive exists.'
      operationId: export_conversation_api_conversations__id__export_get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      - name: format
        in: query
        required: true
        schema:
          type: string
          enum:
          - jsonl
          - markdown
      responses:
        '200':
          description: Successful Response
          content:
            application/x-ndjson:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/conversations/folders:
    post:
      summary: Create Conv Folder
      description: Create a conversation folder.
      operationId: create_conv_folder_api_conversations_folders_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                path:
                  type: string
                  title: Path
              type: object
              required:
              - path
              title: ConversationFolderRequest
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationFolderCreateResponse'
  /api/conversations/folders/{path}:
    delete:
      summary: Delete Conv Folder
      description: Delete an empty conversation folder.
      operationId: delete_conv_folder_api_conversations_folders__path__delete
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
          title: Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationFolderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      summary: Rename Conv Folder
      description: Rename/move a conversation folder. Merges if target exists.
      operationId: rename_conv_folder_api_conversations_folders__path__put
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
          title: Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationFolderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                path:
                  title: Path
                  type: string
              required:
              - path
              title: ConversationFolderRequest
              type: object
  /api/conversations/{id}/archive:
    post:
      summary: Archive Conversation
      description: Archive a conversation (hide from list, keep data).
      operationId: archive_conversation_api_conversations__id__archive_post
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationLifecycleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/conversations/{id}/unarchive:
    post:
      summary: Unarchive Conversation
      description: Unarchive a conversation (restore to active list).
      operationId: unarchive_conversation_api_conversations__id__unarchive_post
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationLifecycleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/notifications:
    get:
      summary: List Notifications
      description: Return inbox records newest first, with a joined ``read`` bool.
      operationId: list_notifications_api_notifications_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 200
      - name: before
        in: query
        required: false
        schema:
          type: string
  /api/notifications/unread-count:
    get:
      summary: Notifications Unread Count
      description: "Return ``{\"count\": N}`` \u2014 called frequently, stays cheap."
      operationId: notifications_unread_count_api_notifications_unread_count_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationCountResponse'
  /api/notifications/read-all:
    post:
      summary: Notifications Mark All Read
      description: Mark all currently-visible notifications read.
      operationId: notifications_mark_all_read_api_notifications_read_all_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadResponse'
  /api/notifications/{id}/read:
    post:
      summary: Notifications Mark Read
      description: Mark a single notification read. Idempotent.
      operationId: notifications_mark_read_api_notifications__id__read_post
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/upload/{conv_id}:
    post:
      summary: Wrapper
      operationId: wrapper_api_upload__conv_id__post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/workspace:
    get:
      summary: Wrapper
      operationId: wrapper_api_workspace_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListingResponse'
      parameters:
      - name: folder
        in: query
        required: false
        schema:
          type: string
    post:
      summary: Wrapper
      operationId: wrapper_api_workspace_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/workspace/recent:
    get:
      summary: Wrapper
      operationId: wrapper_api_workspace_recent_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRecentResponse'
  /api/autocomplete:
    get:
      summary: Wrapper
      operationId: wrapper_api_autocomplete_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutocompleteResponse'
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
  /api/workspace-file/{path}:
    get:
      summary: Wrapper
      operationId: wrapper_api_workspace_file__path__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceTextResponse'
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
  /api/workspace/{path}:
    get:
      summary: Wrapper
      operationId: wrapper_api_workspace__path__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    put:
      summary: Wrapper
      operationId: wrapper_api_workspace__path__put
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceWriteResponse'
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
      - name: rename_to
        in: query
        required: false
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              properties:
                content:
                  title: Content
                  type: string
                modified:
                  anyOf:
                  - type: number
                  - type: 'null'
                  title: Modified
              required:
              - content
              title: WorkspaceSaveRequest
              type: object
    delete:
      summary: Wrapper
      operationId: wrapper_api_workspace__path__delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDeleteResponse'
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
  /api/config/files:
    get:
      summary: Wrapper
      operationId: wrapper_api_config_files_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/config/files/{path}:
    get:
      summary: Wrapper
      operationId: wrapper_api_config_files__path__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    put:
      summary: Wrapper
      operationId: wrapper_api_config_files__path__put
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/models:
    get:
      summary: Wrapper
      operationId: wrapper_api_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/schedules:
    get:
      summary: Wrapper
      operationId: wrapper_api_schedules_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/schedules/{name}/run:
    post:
      summary: Wrapper
      operationId: wrapper_api_schedules__name__run_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/schedules/{name}/overlay:
    delete:
      summary: Wrapper
      operationId: wrapper_api_schedules__name__overlay_delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/schedules/{name}:
    get:
      summary: Wrapper
      operationId: wrapper_api_schedules__name__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    put:
      summary: Wrapper
      operationId: wrapper_api_schedules__name__put
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/vault:
    get:
      summary: Wrapper
      operationId: wrapper_api_vault_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    post:
      summary: Wrapper
      operationId: wrapper_api_vault_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/vault/folders:
    post:
      summary: Wrapper
      operationId: wrapper_api_vault_folders_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/vault/recent:
    get:
      summary: Wrapper
      operationId: wrapper_api_vault_recent_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/vault/tags:
    get:
      summary: Wrapper
      operationId: wrapper_api_vault_tags_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/vault/{page}:
    get:
      summary: Wrapper
      operationId: wrapper_api_vault__page__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    put:
      summary: Wrapper
      operationId: wrapper_api_vault__page__put
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    delete:
      summary: Wrapper
      operationId: wrapper_api_vault__page__delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /vault/{page}:
    get:
      summary: Wrapper
      operationId: wrapper_vault__page__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/wiki:
    get:
      summary: Wrapper
      operationId: wrapper_api_wiki_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/wiki/{page}:
    get:
      summary: Wrapper
      operationId: wrapper_api_wiki__page__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/widgets:
    get:
      summary: List Widgets
      description: Return the widget catalog with cache-busted js URLs.
      operationId: list_widgets_api_widgets_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetCatalogResponse'
  /widgets/{tier}/{name}/widget.js:
    get:
      summary: Wrapper
      operationId: wrapper_widgets__tier___name__widget_js_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/canvas/{conv_id}:
    get:
      summary: Get Canvas State
      description: Load current canvas state for a conversation.
      operationId: get_canvas_state_api_canvas__conv_id__get
      parameters:
      - name: conv_id
        in: path
        required: true
        schema:
          type: string
          title: Conv Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/sticky/{conv_id}:
    get:
      summary: Get Sticky State
      description: Load current sticky-slot state for a conversation (reload recovery).
      operationId: get_sticky_state_api_sticky__conv_id__get
      parameters:
      - name: conv_id
        in: path
        required: true
        schema:
          type: string
          title: Conv Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StickyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/canvas/{conv_id}/new_tab:
    post:
      summary: Post Canvas New Tab
      description: Create a new canvas tab. Backs the inline 'Open in Canvas' button.
      operationId: post_canvas_new_tab_api_canvas__conv_id__new_tab_post
      parameters:
      - name: conv_id
        in: path
        required: true
        schema:
          type: string
          title: Conv Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasNewTabResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                widget_type:
                  title: Widget Type
                  type: string
                data:
                  additionalProperties: true
                  title: Data
                  type: object
                label:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Label
              required:
              - widget_type
              - data
              title: CanvasNewTabRequest
              type: object
  /api/canvas/{conv_id}/active_tab:
    post:
      summary: Post Canvas Active Tab
